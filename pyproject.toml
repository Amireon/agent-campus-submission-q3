[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "DeepSeek Flash enterprise knowledge-base QA agent with grounded citations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kb-agent = "kb_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
